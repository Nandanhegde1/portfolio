# fly.toml — Fly.io app configuration
# Generated for the Portfolio Express API.
# Region 'bom' = Mumbai (closest to author). Change with `fly regions set <code>`.

app = "nandan-portfolio-api"
primary_region = "bom"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  ALLOWED_ORIGINS = "https://nandanhegde1.github.io,http://localhost:4200"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running 24/7 so there's NO cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
