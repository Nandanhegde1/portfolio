<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#8b83ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Terminal-style tag -->
  <text x="80" y="120" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="22" fill="#6c63ff">// senior full-stack engineer · ai products</text>

  <!-- Name -->
  <text x="80" y="220" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="92" fill="#e6edf3">Nandan Hegde</text>

  <!-- Tagline -->
  <text x="80" y="290" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="36" fill="#8b949e">I build full-stack products — and the AI inside them</text>

  <!-- Underline -->
  <rect x="80" y="320" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Stats row -->
  <g font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#8b949e">
    <text x="80" y="400">
      <tspan font-weight="700" fill="#e6edf3" font-size="28">6+</tspan>
      <tspan dx="10">years experience</tspan>
    </text>
    <text x="350" y="400">
      <tspan font-weight="700" fill="#e6edf3" font-size="28">10K+</tspan>
      <tspan dx="10">users served</tspan>
    </text>
    <text x="600" y="400">
      <tspan font-weight="700" fill="#e6edf3" font-size="28">AWS</tspan>
      <tspan dx="10">Certified</tspan>
    </text>
  </g>

  <!-- Tech stack pills -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="18">
    <rect x="80" y="460" width="100" height="38" rx="19" fill="none" stroke="#6c63ff" stroke-width="2"/>
    <text x="130" y="485" text-anchor="middle" fill="#6c63ff">Angular</text>

    <rect x="200" y="460" width="120" height="38" rx="19" fill="none" stroke="#6c63ff" stroke-width="2"/>
    <text x="260" y="485" text-anchor="middle" fill="#6c63ff">TypeScript</text>

    <rect x="340" y="460" width="100" height="38" rx="19" fill="none" stroke="#6c63ff" stroke-width="2"/>
    <text x="390" y="485" text-anchor="middle" fill="#6c63ff">Node.js</text>

    <rect x="460" y="460" width="80" height="38" rx="19" fill="none" stroke="#6c63ff" stroke-width="2"/>
    <text x="500" y="485" text-anchor="middle" fill="#6c63ff">LLMs</text>

    <rect x="560" y="460" width="80" height="38" rx="19" fill="none" stroke="#6c63ff" stroke-width="2"/>
    <text x="600" y="485" text-anchor="middle" fill="#6c63ff">Azure</text>
  </g>

  <!-- URL -->
  <text x="80" y="580" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="20" fill="#6c63ff">→ nandanhegde1.github.io/portfolio</text>

  <!-- Decorative code brackets -->
  <text x="980" y="380" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="280" fill="#6c63ff" opacity="0.15" font-weight="700">&lt;/&gt;</text>
</svg>
