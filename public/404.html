<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nandan Hegde | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    // GH Pages SPA redirect — converts /portfolio/some/route to /portfolio/?p=/some/route
    // app.component then rewrites to the proper Angular route
    (function () {
      var segmentCount = 1; // /portfolio/ base
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }());
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
