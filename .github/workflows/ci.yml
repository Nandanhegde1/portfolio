name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build --configuration=production --base-href=/portfolio/
      # Pages answers any path it has no file for with 404.html and HTTP 404, so
      # deep links would never index. A copy of index.html at <route>.html is served
      # at the extensionless URL with 200 (<route>/index.html would 301 to a trailing
      # slash). Routes come from the sitemap; each copy gets its own canonical URL.
      - name: Give each sitemap route its own HTML file
        working-directory: dist/portfolio/browser
        run: |
          set -euo pipefail
          base='https://nandanhegde1.github.io/portfolio/'
          routes=$(sed -n "s#.*<loc>${base}\([^<]\+\)</loc>.*#\1#p" sitemap.xml)
          [ -n "$routes" ] || { echo "No routes found in sitemap.xml"; exit 1; }
          for route in $routes; do
            mkdir -p "$(dirname "$route")"
            sed "s#<link rel=\"canonical\" href=\"${base}\">#<link rel=\"canonical\" href=\"${base}${route}\">#" index.html > "$route.html"
            grep -q "href=\"${base}${route}\"" "$route.html" || { echo "Canonical not set in $route.html"; exit 1; }
            echo "$route.html"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/portfolio/browser

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # Deploys only after lint + tests + build all pass — no separate racing workflow.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
